name: Supabase keep-alive

# Supabase's free plan pauses a project after a week without requests. Once a week this asks the
# project one small question (nothing is read: the anon key sees no rows), so it stays awake.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the project once
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No Supabase project set up yet."; exit 0; fi
          curl -fsS "$URL/rest/v1/players?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
